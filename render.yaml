services:
  - type: web
    name: servenep-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/services
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Set these two manually in the Render dashboard after the first deploy:
      #   DATABASE_URL  -> the Neon connection string (Dashboard > Connect)
      #   CORS_ORIGIN   -> your Vercel frontend URL, e.g. https://servenep.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DB_SYNCHRONIZE
        value: "true"
      # true = this deploy is a public demo with no real SMS gateway, so the
      # one-click demo login and visible OTP stay enabled despite NODE_ENV=
      # production. Set to "false" (or remove) for a deployment with real users.
      - key: DEMO_MODE
        value: "true"
