version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: servenep-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: servenep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servenep"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: servenep-cache
    ports:
      - "6379:6379"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servenep-backend
    environment:
      - PORT=5000
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgrespassword
      - DATABASE_NAME=servenep
      - JWT_SECRET=${JWT_SECRET:-}
      - CORS_ORIGIN=http://localhost:3000,http://localhost
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: servenep-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
  nginx:
    image: nginx:alpine
    container_name: servenep-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
volumes:
  pgdata: